name: eval-untrusted-bzl
# Simulates a Buck2-style host application: builds the starlark interpreter
# from TRUSTED base-branch source only, then feeds it PR-supplied .bzl/.star
# files purely as DATA (via `git show`, never compiled/executed as Rust).
# This is Scenario B: the PR author's only capability is Starlark text content.

on:
  pull_request:
    paths:
      - '**/*.bzl'
      - '**/*.star'

jobs:
  eval:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout TRUSTED base branch only (PR's Rust changes, if any, are ignored)
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@stable

      - name: Build starlark CLI from trusted base-branch source
        run: cargo build --release -p starlark_bin

      - name: Extract PR's changed .bzl/.star files as raw data (not compiled)
        run: |
          git fetch origin pull/${{ github.event.pull_request.number }}/head:pr-head
          files=$(git diff --name-only ${{ github.event.pull_request.base.sha }} pr-head -- '*.bzl' '*.star')
          mkdir -p /tmp/untrusted
          : > /tmp/untrusted_files.txt
          for f in $files; do
            mkdir -p "/tmp/untrusted/$(dirname "$f")"
            git show "pr-head:$f" > "/tmp/untrusted/$f"
            echo "$f" >> /tmp/untrusted_files.txt
          done

      - name: Evaluate untrusted Starlark text with the trusted binary
        run: |
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            echo "::group::Evaluating untrusted file: $f"
            ./target/release/starlark "/tmp/untrusted/$f"
            echo "::endgroup::"
          done < /tmp/untrusted_files.txt
